# GENERATED by scripts/platform-config.mjs from platform.config.json and apps.json. Do not edit.
#
# The shared platform Worker. Deploy it once, before any app, and again whenever apps.json changes.
# It owns the account-wide usage meter and every app's scoreboard; apps bind to them by script_name.
# Cloudflare Access protects apps.example.com as ONE hostname-based application covering every path.
name = "app-platform"
main = "src/platform.ts"
compatibility_date = "2026-10-01"

workers_dev = false
preview_urls = false
send_metrics = false

# The index page and the platform API only; each app owns its own /<id>/* routes.
routes = [
  { pattern = "apps.example.com/", zone_name = "example.com" },
  { pattern = "apps.example.com/index.html", zone_name = "example.com" },
  { pattern = "apps.example.com/api/platform/*", zone_name = "example.com" },
]

[vars]
TEAM = ""
ACCESS_AUD = ""
ALLOWED_EMAILS = ""
APPS = "[]"

[[durable_objects.bindings]]
name = "USAGE"
class_name = "UsageMeter"

[[durable_objects.bindings]]
name = "SCORES"
class_name = "Scores"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageMeter", "Scores"]
