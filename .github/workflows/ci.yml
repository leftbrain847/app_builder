# app_builder's own checks: the platform's tests, plus a solo and a turn-based app generated from
# the template and put through the same checks every real app gets. A platform change that would
# break new apps fails here, before any app syncs it.
#
# The platform Worker deploys from here on main once platform.config.json has real values and the
# CLOUDFLARE_API_TOKEN secret is set on this repo.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Run workflow (Actions tab) redeploys the platform Worker, e.g. after changing the ALLOWED_EMAILS secret.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Template still produces working apps
        run: |
          for mode in solo turn invite; do
            dir="$RUNNER_TEMP/demo-$mode"
            node scripts/create-app.mjs "demo-$mode" --mode "$mode" --out "$dir"
            (cd "$dir" && npm install --no-audit --no-fund && npm run typecheck && npm test && npm run build && npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/out-$mode")
            # the sprint demo: one self-contained page per day (solo and invite apps; turn apps have none)
            if [ "$mode" != turn ]; then (cd "$dir" && npm run snapshot && test -s dist/demo/page.html); fi
          done
          (cd "$RUNNER_TEMP/demo-solo" && npm run build:play)

  deploy-platform:
    needs: test
    # One deploy at a time, so a Run workflow and a push can't race with different ALLOWED_EMAILS.
    concurrency:
      group: deploy-platform
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Configured yet?
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          host=$(node -p "require('./platform.config.json').appsHost")
          if [ "$host" = "apps.example.com" ] || [ "$HAS_TOKEN" != "true" ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; echo "Skipping: fill in platform.config.json and add the CLOUDFLARE_API_TOKEN secret."; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - run: npm ci
        if: steps.gate.outputs.ready == 'true'
      - name: Deploy the platform Worker
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Friends' emails, comma-separated: a GitHub secret, never in the repo. Uploaded as the Worker secret of the same name.
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
        run: |
          node scripts/platform-config.mjs
          export CLOUDFLARE_ACCOUNT_ID=$(node -p "require('./platform.config.json').cloudflareAccountId")
          secrets=()
          if [ -n "$ALLOWED_EMAILS" ]; then
            trap 'rm -f "$RUNNER_TEMP/secrets.json"' EXIT
            node -e "require('fs').writeFileSync(process.argv[1], JSON.stringify({ ALLOWED_EMAILS: process.env.ALLOWED_EMAILS }))" "$RUNNER_TEMP/secrets.json"
            secrets=(--secrets-file "$RUNNER_TEMP/secrets.json")
          elif [ "$(node -p "require('./platform.config.json').requireEmailAllowlist === true")" = true ]; then
            echo "::error::requireEmailAllowlist is on but the ALLOWED_EMAILS secret is not set on this repo"; exit 1
          fi
          cd packages/host && npx wrangler deploy -c wrangler.platform.toml "${secrets[@]}"
